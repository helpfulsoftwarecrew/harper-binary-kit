name: Publish

on:
  # A hand-pushed v* tag is the only publish trigger; a merge alone ships nothing.
  push:
    tags: ['v*']

# The default for every job, including the reusable test call, which otherwise runs on the repo default
# token grant; the publish job re-elevates id-token in its own block, where the registry needs it.
permissions:
  contents: read

# Deleting and re-pushing a tag while a run is still live must queue behind it, not interleave around
# the npm publish step.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same workflow that gates every branch push, so a tag cannot publish on weaker checks than a PR merges on.
  # macOS is left out because hosted macOS runners have gone unscheduled for hours and cancelled a release; it
  # still runs on every push, and the macOS suite is run locally before each tag.
  test:
    uses: ./.github/workflows/test.yml
    with:
      os: '["ubuntu-latest", "windows-latest"]'

  publish:
    needs: test
    runs-on: ubuntu-latest
    # An npm ci and a publish; the margin is for a runner that never schedules.
    timeout-minutes: 15
    permissions:
      contents: read
      # The only publish credential: npm exchanges this token through the trusted publisher, which names this
      # repository and this workflow file, and signs provenance from it.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          # No registry-url: it writes an .npmrc whose auth line reads NODE_AUTH_TOKEN, and npm publishes to
          # registry.npmjs.org by default, so OIDC needs nothing from it.

      - name: Install dependencies
        run: npm ci

      # A pause on publishing is spelled `"private": true` in the manifest; this step is what makes that spelling stick.
      - name: Refuse to publish while package.json says private
        run: |
          node -e '
            const manifest = JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));
            if (manifest.private) {
              console.log("::error::package.json still carries \"private\": true, so publishing is refused. Remove the flag once the package is ready to ship, then re-tag.");
              process.exit(1);
            }
          '

      # A tag naming one version while the manifest carries another would ship the wrong bits under a traceable name.
      - name: Refuse a tag that disagrees with package.json
        run: |
          node -e '
            const { version } = JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== `v${version}`) {
              console.log(`::error::Tag ${tag} does not match package.json version ${version}. Bump the version or move the tag so the two agree, then push the tag again.`);
              process.exit(1);
            }
          '

      # Consumers call `release.yml` at a tag, so a tag that publishes the package without carrying the
      # reusable workflow would leave `uses: ...@vX` resolving to a ref that has no such file.
      - name: Refuse a tag whose reusable workflow is missing
        run: |
          test -f .github/workflows/release.yml || {
            echo "::error::This tag carries no .github/workflows/release.yml, which is the file consumers name in \`uses:\`. Publishing it would hand them a ref that resolves to nothing."
            exit 1
          }

      # Trusted publishing arrived in npm 11.5.1, and with no token to fall back on an older npm reads as a 404.
      - name: Refuse an npm without trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.log(`::error::npm ${process.argv[1]} cannot publish through a trusted publisher, which needs npm 11.5.1 or later, and this workflow holds no token. Raise the node-version, then re-tag.`);
              process.exit(1);
            }
          ' "$(npm --version)"

      # No prerelease is published, so every version on the registry is one a bare install may be handed.
      - name: Refuse a prerelease version
        run: |
          node -e '
            const { version } = JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));
            if (version.includes("-")) {
              console.log(`::error::Version ${version} is a prerelease, and prereleases are not published. Release it as a plain major.minor.patch version, then re-tag.`);
              process.exit(1);
            }
          '

      # Chosen before the publish, since OIDC authorises `npm publish` and no dist-tag write after it: latest for a
      # version newer than the registry's latest, release-<major>.<minor> for a patch to an older line.
      - name: Choose the dist-tag from the registry's latest
        id: dist
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { distTag } from "./src/publish.js";
            import { latestOf } from "./src/published.js";
            const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
            let current;
            try {
              current = await latestOf(name);
            } catch (error) {
              console.log(`::error::Could not read the latest dist-tag of ${name}: ${error.message}. Nothing was published; re-run the job.`);
              process.exit(1);
            }
            const tag = distTag(version, current);
            appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
            console.log(`Publishing ${version} under the ${tag} dist-tag; latest names ${current ?? "nothing yet"}.`);
          '

      # No build: the tarball is src/ as the matrix tested it. A served version is skipped, since npm refuses a
      # republish and a re-run would otherwise fail on its own release.
      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "already published $name@$version; the registry serves it, so it was not published again"
            exit 0
          fi
          npm publish --access public --tag '${{ steps.dist.outputs.tag }}'
